[project]
name = "search-lab"
version = "0.1.0"
description = "Modular search and information retrieval pipeline lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
pdf = ["pypdf>=4.0.0"]
docx = ["python-docx>=1.1.0"]
vector = ["faiss-cpu>=1.8.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
